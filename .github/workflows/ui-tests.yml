name: UI Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_kw:
        description: "pytest -k 过滤表达式，留空跑全部用例（例：test_login_success）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          sudo tar -zxf allure-2.29.0.tgz -C /opt/
          sudo ln -sf /opt/allure-2.29.0/bin/allure /usr/bin/allure

      # 用例失败时也要出报告、发邮件，所以后续步骤用 if: always()
      # test_kw 为空时跑全量；手动触发填表达式时只跑匹配的用例
      - name: Run UI tests
        env:
          TEST_KW: ${{ inputs.test_kw }}
        run: |
          if [ -z "$TEST_KW" ]; then
            pytest tests -v --headless
          else
            pytest tests -v --headless -k "$TEST_KW"
          fi

      - name: Generate Allure report
        if: always()
        run: allure generate reports/allure-results -o reports/allure-report --clean

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: reports/allure-report

      - name: Send report mail
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python src/mailer.py
