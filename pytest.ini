[pytest]
# 用例根目录
testpaths = tests

# 工程根目录加入 sys.path，便于 import core / pages / steps
pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 控制台日志（步骤装饰器输出）
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(message)s
log_cli_date_format = %H:%M:%S

# -v 详细输出 / --tb=short 简短报错 / Allure 原始结果目录(每次运行前清空)
addopts = -v --tb=short --alluredir=reports/allure-results --clean-alluredir
